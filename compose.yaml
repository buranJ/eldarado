name: gamestock

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamestock
      POSTGRES_USER: gamestock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamestock -d gamestock"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELDORADO_CLIENT_ID: ${ELDORADO_CLIENT_ID:-}
      ELDORADO_CLIENT_SECRET: ${ELDORADO_CLIENT_SECRET:-}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${GAMESTOCK_DATA_DIR:-./data}/storage:/app/apps/api/storage
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:3100:80"
    networks:
      - internal

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_DB: gamestock
      POSTGRES_USER: gamestock
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-1}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MIN_AGE_SECONDS: ${BACKUP_MIN_AGE_SECONDS:-82800}
      S3_PROVIDER: ${S3_PROVIDER:-Other}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-gamestock/}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    command:
      - /bin/sh
      - -c
      - while true; do if /scripts/backup.sh; then sleep "$${BACKUP_INTERVAL_SECONDS}"; else sleep 300; fi; done
    volumes:
      - ./scripts:/scripts:ro
      - ${GAMESTOCK_DATA_DIR:-./data}/storage:/source-storage:ro
      - ${GAMESTOCK_BACKUP_DIR:-./backups/automatic}:/backups
    networks:
      - internal

  monitor:
    image: alpine:3.22
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      MONITOR_DISK_USED_PERCENT: ${MONITOR_DISK_USED_PERCENT:-85}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      MONITOR_TLS_HOST: ${MONITOR_TLS_HOST:-}
      MONITOR_TLS_EXPIRY_DAYS: ${MONITOR_TLS_EXPIRY_DAYS:-14}
      MONITOR_BACKUP_MAX_AGE_SECONDS: ${MONITOR_BACKUP_MAX_AGE_SECONDS:-129600}
    command: ["/bin/sh", "-c", "apk add --no-cache curl openssl >/dev/null && exec /scripts/monitor.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ${GAMESTOCK_DATA_DIR:-./data}:/data:ro
      - ${GAMESTOCK_BACKUP_DIR:-./backups/automatic}:/backups:ro
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
