name: gamestock

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamestock
      POSTGRES_USER: gamestock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamestock -d gamestock"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELDORADO_CLIENT_ID: ${ELDORADO_CLIENT_ID:-}
      ELDORADO_CLIENT_SECRET: ${ELDORADO_CLIENT_SECRET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${GAMESTOCK_DATA_DIR:-./data}/storage:/app/apps/api/storage
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:3100:80"
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:

