# Host Nginx for GameStock on gameteam.biz.
# Certbot serves HTTP-01 challenges for the domain and the fallback IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gameteam.biz www.gameteam.biz 131.222.133.247;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://gameteam.biz$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 131.222.133.247;

    ssl_certificate /etc/letsencrypt/live/131.222.133.247/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/131.222.133.247/privkey.pem;
    return 301 https://gameteam.biz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gameteam.biz;

    ssl_certificate /etc/letsencrypt/live/gameteam.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gameteam.biz/privkey.pem;
    return 301 https://gameteam.biz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gameteam.biz;

    ssl_certificate /etc/letsencrypt/live/gameteam.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gameteam.biz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
